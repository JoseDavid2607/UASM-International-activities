name: Actualizar datos del cronograma

on:
  schedule:
    - cron: '17 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generar data/events.json y data/evidence.json desde Drive
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: node scripts/build-data.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Actualizar datos del cronograma desde Drive" && git push; fi
